[package]
name = "treasury"
description = "PAPERHANDS V3 community treasury. Donations and two-approver timelock only."
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AhmedAmer72/PaperHands"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
conviction = { path = "../conviction" }
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

[profile.dev]
overflow-checks = true

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
